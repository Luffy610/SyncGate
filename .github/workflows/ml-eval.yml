# Nightly biometric evaluation (ADR-0020 §2): re-runs the LFW evaluation of
# the shipped models and fails if the thresholds in manifest.json or the
# headline numbers drift from what is committed.
name: ml-eval

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache/ml/lfw
          key: lfw-9b711dca71a4-ea42330c62c9

      - name: Data
        run: |
          ml/scripts/fetch_lfw.sh .cache/ml
          pip install -r ml/requirements.txt

      - name: Evaluate
        run: |
          python -I ml/eval/evaluate.py --data .cache/ml \
            --models packages/sg_vision/assets/models \
            --report ml/reports/sface-int8-lfw.md \
            --manifest packages/sg_vision/assets/models/manifest.json

      - name: Results match the committed report and thresholds
        run: git diff --exit-code -- ml/reports packages/sg_vision/assets/models/manifest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-eval-report
          path: ml/reports/
