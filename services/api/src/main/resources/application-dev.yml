# Local development: a file-backed H2 database (data survives restarts), demo
# secrets and a demo clock that matches the demo time of the Flutter dev
# flavour. NEVER use this profile in production.
spring:
  datasource:
    url: jdbc:h2:file:./data/syncgate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

syncgate:
  clock:
    # The Flutter dev flavour pretends it is this time, then runs in real time.
    start: "2026-10-24T05:52:00+05:30"
  security:
    jwt-secret: dev-only-jwt-secret-change-me-0123456789abcdef
    master-key: ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcyEhISE=
    device-keys:
      - dev-device-key-local
    allowed-origins:
      - http://localhost:8080
      - http://localhost:5000
  licence:
    mock: true
